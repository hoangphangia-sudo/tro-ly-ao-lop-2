<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Vở Học Lớp 2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;600&display=swap">
<style>
/* Bố cục: trang vở ô li, bạn Sao Nhỏ dẫn chuyện ở đầu trang, mỗi màn chỉ một việc, nút to cho ngón tay nhỏ. */
:root{
  --paper:#f6f9ff; --grid:#dfe8f8; --grid-strong:#c7d6f0;
  --surface:#ffffff; --line:#cdd9ef;
  --ink:#2a2870; --ink-soft:#5f5ea6; --on-color:#ffffff;
  --toan:#2c6cf0; --toan-bg:#e3ecff; --toan-deep:#1d4fbd;
  --tv:#e2476a; --tv-bg:#ffe6ec; --tv-deep:#b62f50;
  --en:#0f9a78; --en-bg:#dcf6ee; --en-deep:#0a7359;
  --sun:#ffb700; --sun-deep:#d98f00; --star-off:#d5dbea;
  --red:#cf2f3a; --good:#1c7f45; --good-bg:#e4f5ea; --warn-bg:#fdecee;
  --display:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#12261f; --grid:#183229; --grid-strong:#214137;
  --surface:#1a362d; --line:#31544a;
  --ink:#f5f2e3; --ink-soft:#b6c9be; --on-color:#10221c;
  --toan:#8fb4ff; --toan-bg:#1d3357; --toan-deep:#5d8be6;
  --tv:#ff9db3; --tv-bg:#4d2733; --tv-deep:#e06f8b;
  --en:#7fe0c3; --en-bg:#17443a; --en-deep:#4fb999;
  --sun:#ffd24a; --sun-deep:#d9a800; --star-off:#3d5a50;
  --red:#ff9a9a; --good:#93e3ab; --good-bg:#1f4a37; --warn-bg:#4a2a2c;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#12261f; --grid:#183229; --grid-strong:#214137;
  --surface:#1a362d; --line:#31544a;
  --ink:#f5f2e3; --ink-soft:#b6c9be; --on-color:#10221c;
  --toan:#8fb4ff; --toan-bg:#1d3357; --toan-deep:#5d8be6;
  --tv:#ff9db3; --tv-bg:#4d2733; --tv-deep:#e06f8b;
  --en:#7fe0c3; --en-bg:#17443a; --en-deep:#4fb999;
  --sun:#ffd24a; --sun-deep:#d9a800; --star-off:#3d5a50;
  --red:#ff9a9a; --good:#93e3ab; --good-bg:#1f4a37; --warn-bg:#4a2a2c;
  color-scheme:dark }
*{box-sizing:border-box}
body{
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid-strong) 1px,transparent 1px),linear-gradient(90deg,var(--grid-strong) 1px,transparent 1px),
    linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:48px 48px,48px 48px,12px 12px,12px 12px;
  color:var(--ink); font-family:var(--body); font-size:18px; line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 40px; -webkit-tap-highlight-color:transparent;
}
#app{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.toan{--c:var(--toan);--cb:var(--toan-bg);--cd:var(--toan-deep)}
.tv{--c:var(--tv);--cb:var(--tv-bg);--cd:var(--tv-deep)}
.en{--c:var(--en);--cb:var(--en-bg);--cd:var(--en-deep)}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:2rem;font-weight:800} h2{font-size:1.5rem;font-weight:800} h3{font-size:1.15rem;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.note{color:var(--ink-soft);font-size:.92rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.spread{justify-content:space-between} .row.mid{justify-content:center}
.center{text-align:center}

/* Thanh trên */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums}
.pill .s{color:var(--sun)}
.back{min-height:46px;padding:4px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:600}

/* Sao Nhỏ và lời nói */
.guide{display:flex;gap:12px;align-items:flex-end}
.mascot{flex:0 0 auto;width:88px;height:88px}
.mascot .body{fill:var(--sun);stroke:var(--sun-deep);stroke-width:5;stroke-linejoin:round}
.mascot .eye{fill:#2a2870} .mascot .cheek{fill:#ff8fa3;opacity:.75}
.mascot .mouth{fill:none;stroke:#2a2870;stroke-width:4;stroke-linecap:round}
.bubble{position:relative;flex:1;min-width:0;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 16px;font-size:1.15rem}
.bubble::before{content:"";position:absolute;left:-10px;bottom:22px;width:16px;height:16px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble b{font-family:var(--display);font-size:1.3rem}

/* Ô môn học */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;min-height:150px;padding:16px;border-radius:22px;border:none;background:var(--c);color:var(--on-color);box-shadow:0 6px 0 var(--cd)}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 var(--cd)}
.tile .glyph{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1}
.tile .name{font-family:var(--display);font-weight:800;font-size:1.6rem}
.tile .prog{font-weight:600;font-variant-numeric:tabular-nums;opacity:.95}

/* Danh sách bài */
.steps{display:flex;flex-direction:column;gap:12px}
.lesson{display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:72px;padding:10px 14px;border-radius:18px;border:2px solid var(--line);background:var(--surface);box-shadow:0 4px 0 var(--line)}
.lesson:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.badge{flex:0 0 auto;width:46px;height:46px;border-radius:50%;background:var(--c);color:var(--on-color);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:1.3rem}
.lesson .nm{flex:1;min-width:0;font-weight:600}
.st{flex:0 0 auto;font-size:1.3rem;letter-spacing:2px;color:var(--star-off)}
.st b{color:var(--sun);font-weight:400}

/* Thẻ nội dung */
.sheet{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.sheet.tint{border-color:var(--c);border-top-width:8px}
.btn{min-height:60px;padding:8px 22px;border-radius:16px;border:none;background:var(--c,var(--toan));color:var(--on-color);font-family:var(--display);font-size:1.3rem;font-weight:800;box-shadow:0 5px 0 var(--cd,var(--toan-deep))}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--cd,var(--toan-deep))}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.btn.small{min-height:46px;font-size:1rem;padding:4px 16px}
.btn.wide{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left}
.btn:disabled{opacity:.45;cursor:default}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink-soft)}
.dots i.done{background:var(--ink-soft)} .dots i.now{background:var(--sun);border-color:var(--sun)}
.passage{background:var(--paper);border-left:5px solid var(--c,var(--tv));padding:12px 14px;border-radius:8px;font-size:1.15rem}
.prompt{font-family:var(--display);font-size:1.8rem;font-weight:800;overflow-wrap:anywhere}
.prompt.sum{font-size:3.2rem;text-align:center;font-variant-numeric:tabular-nums}
.pic{font-size:5.5rem;line-height:1;text-align:center}
.word{font-family:var(--display);font-weight:800;font-size:2.4rem;text-align:center}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.opt{min-height:66px;padding:10px 14px;border-radius:16px;border:2px solid var(--line);background:var(--paper);font-size:1.2rem;font-weight:600;overflow-wrap:anywhere;box-shadow:0 4px 0 var(--line)}
.opt .big{display:block;font-size:2.8rem;line-height:1.1}
.opt[aria-pressed="true"]{border-color:var(--c,var(--toan));background:var(--cb,var(--toan-bg));box-shadow:0 4px 0 var(--c,var(--toan))}
.answer{font-family:var(--display);font-size:2.8rem;font-weight:800;text-align:center;min-height:72px;border:3px dashed var(--c,var(--toan));border-radius:16px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;background:var(--paper)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{min-height:60px;border-radius:16px;border:2px solid var(--line);background:var(--paper);font-family:var(--display);font-size:1.7rem;font-weight:800;box-shadow:0 4px 0 var(--line)}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.answer.line{flex-wrap:wrap;gap:8px;justify-content:flex-start;padding:10px;font-size:1.25rem}
.tok{min-height:52px;padding:6px 16px;border-radius:14px;border:2px solid var(--line);background:var(--paper);font-family:var(--body);font-weight:600;font-size:1.25rem;box-shadow:0 4px 0 var(--line)}
.tok.on{border-color:var(--c,var(--toan));background:var(--cb,var(--toan-bg));box-shadow:0 4px 0 var(--c,var(--toan))}
.fb{border-radius:16px;padding:12px 14px;font-weight:600}
.fb.ok{background:var(--good-bg);color:var(--good)} .fb.no{background:var(--warn-bg);color:var(--red)}
.fb.info{background:var(--paper);color:var(--ink-soft);border:2px dashed var(--line)}
.fb span{display:block;font-weight:400;color:var(--ink)}
.bigstars{font-size:4rem;line-height:1;text-align:center;letter-spacing:6px;color:var(--star-off)}
.bigstars b{color:var(--sun);font-weight:400}
.score{font-family:var(--display);font-size:2.4rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}

/* Hình minh hoạ bài giảng */
.vis{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0}
.tf{display:grid;grid-template-columns:repeat(5,40px);gap:6px;padding:8px;border:3px solid var(--ink-soft);border-radius:12px;background:var(--paper)}
.cell{width:40px;height:40px;border-radius:8px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center}
.dot{width:30px;height:30px;border-radius:50%;background:var(--toan);position:relative}
.dot.b{background:var(--tv)}
.dot.x{opacity:.35}
.dot.x::after{content:"";position:absolute;left:-4px;right:-4px;top:13px;height:4px;background:var(--red);transform:rotate(-40deg);border-radius:2px}
.loose{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:30px}
.col{font-family:var(--display);font-weight:800;font-size:2.8rem;line-height:1.15;font-variant-numeric:tabular-nums;white-space:pre;text-align:right}
.col .rule{height:4px;background:var(--ink);border-radius:2px;margin:4px 0}
.col .carry{font-size:1rem;color:var(--red);font-family:var(--body);font-weight:600;white-space:normal}
.col .res{color:var(--c,var(--toan))}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{padding:6px 14px;border-radius:999px;background:var(--cb,var(--tv-bg));font-weight:600;font-size:1.15rem}

/* Trang bố mẹ */
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.95rem;min-width:0}
select,input[type=number],textarea{font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:10px;min-height:46px;max-width:100%}
textarea{width:100%;min-height:150px;font-size:.9rem}
.overlay{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20}
.overlay .sheet{max-width:520px;width:100%;text-align:center;align-items:center}
.count{font-family:var(--display);font-size:4rem;font-weight:800;font-variant-numeric:tabular-nums}
@media (max-width:430px){ body{font-size:17px} h1{font-size:1.7rem} .prompt{font-size:1.45rem} .prompt.sum{font-size:2.6rem} .mascot{width:68px;height:68px} .bubble{font-size:1.05rem} .tf{grid-template-columns:repeat(5,34px)} .cell{width:34px;height:34px} .dot{width:26px;height:26px} .dot.x::after{top:11px} }
@media (prefers-reduced-motion:no-preference){
  .mascot{animation:bob 2.6s ease-in-out infinite} @keyframes bob{50%{transform:translateY(-5px) rotate(3deg)}}
  .fb,.bigstars b{animation:pop .22s ease-out} @keyframes pop{from{transform:scale(.9)}to{transform:none}}
  .tile,.lesson,.btn,.key,.opt{transition:transform .06s}
}
</style>

<div id="app"></div>
<div id="break" class="overlay" hidden></div>

<script>
/* ===== Tiện ích ===== */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[rnd(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).toLowerCase().normalize('NFC').replace(/[.,!?;:"“”'’\-–()]/g,' ').replace(/\s+/g,' ').trim();

/* ===== Toán: bài sinh tự động, máy chấm theo đáp án tính sẵn ===== */
const num=(q,say,ans,hint,explain)=>({type:'num',q,say,ans,hint,explain,sum:true});
function genCong20(){const a=rnd(6,9),b=rnd(11-a,9),k=10-a;
  return num(`${a} + ${b}`,`${a} cộng ${b} bằng mấy?`,a+b,`Tách ${b} để ${a} tròn 10: ${a} + ${k} = 10.`,`${b} gồm ${k} và ${b-k}. ${a} + ${k} = 10, rồi 10 + ${b-k} = ${a+b}.`)}
function genTru20(){const m=rnd(11,18),s=rnd(m-9,9),k=m-10;
  return num(`${m} − ${s}`,`${m} trừ ${s} bằng mấy?`,m-s,`Trừ ${k} trước để còn 10: ${m} − ${k} = 10.`,`${s} gồm ${k} và ${s-k}. ${m} − ${k} = 10, rồi 10 − ${s-k} = ${m-s}.`)}
function genCong100a(){const t=rnd(1,8),u=rnd(2,9),b=rnd(10-u,9),a=t*10+u;
  return num(`${a} + ${b}`,`${a} cộng ${b} bằng mấy?`,a+b,`Cộng hàng đơn vị trước: ${u} + ${b} = ${u+b}.`,`${u} + ${b} = ${u+b}, viết ${(u+b)%10}, nhớ 1. ${t} thêm 1 bằng ${t+1}. Kết quả là ${a+b}.`)}
function genCong100b(){const t1=rnd(1,7),t2=rnd(1,8-t1),u1=rnd(2,9),u2=rnd(10-u1,9),a=t1*10+u1,b=t2*10+u2;
  return num(`${a} + ${b}`,`${a} cộng ${b} bằng mấy?`,a+b,`Cộng hàng đơn vị trước: ${u1} + ${u2} = ${u1+u2}, nhớ 1 sang hàng chục.`,`Hàng đơn vị: ${u1} + ${u2} = ${u1+u2}, viết ${(u1+u2)%10}, nhớ 1. Hàng chục: ${t1} + ${t2} = ${t1+t2}, thêm 1 bằng ${t1+t2+1}. Kết quả là ${a+b}.`)}
function genTru100a(){const t=rnd(2,9),u=rnd(0,8),b=rnd(u+1,9),a=t*10+u;
  return num(`${a} − ${b}`,`${a} trừ ${b} bằng mấy?`,a-b,`${u} không trừ được ${b}. Con lấy ${10+u} trừ ${b}.`,`${10+u} − ${b} = ${10+u-b}, viết ${10+u-b}, nhớ 1. ${t} − 1 = ${t-1}. Kết quả là ${a-b}.`)}
function genTru100b(){const t1=rnd(3,9),t2=rnd(1,t1-2),u1=rnd(0,8),u2=rnd(u1+1,9),a=t1*10+u1,b=t2*10+u2;
  return num(`${a} − ${b}`,`${a} trừ ${b} bằng mấy?`,a-b,`${u1} không trừ được ${u2}. Con lấy ${10+u1} trừ ${u2}, rồi nhớ 1.`,`Hàng đơn vị: ${10+u1} − ${u2} = ${10+u1-u2}, viết ${10+u1-u2}, nhớ 1. Hàng chục: ${t2} thêm 1 bằng ${t2+1}, ${t1} − ${t2+1} = ${t1-t2-1}. Kết quả là ${a-b}.`)}
function genLoiVan(){const a=rnd(9,20),b=rnd(3,8),more=Math.random()<.5;
  const [x,y,thing]=pick([['Lan','Mai','quyển vở'],['Nam','Việt','viên bi'],['Tổ Một','Tổ Hai','cây'],['Hà','Bình','bông hoa']]);
  const verb=thing==='cây'?'trồng được':'có';
  const q=`${x} ${verb} ${a} ${thing}. ${y} ${verb} ${more?'nhiều hơn':'ít hơn'} ${x} ${b} ${thing}. Hỏi ${y} ${verb} bao nhiêu ${thing}?`;
  const ans=more?a+b:a-b;
  return {type:'num',q,say:q,ans,hint:more?'"Nhiều hơn" thì con làm phép cộng.':'"Ít hơn" thì con làm phép trừ.',explain:`${a} ${more?'+':'−'} ${b} = ${ans}. ${y} ${verb} ${ans} ${thing}.`}}
function genKgL(){const k=rnd(0,3);let q,ans,ex;
  if(k===0){const a=rnd(2,9),b=rnd(2,9);q=`Con gà nặng ${a} kg. Con ngỗng nặng ${b} kg. Cả hai con nặng bao nhiêu ki-lô-gam?`;ans=a+b;ex=`${a} kg + ${b} kg = ${ans} kg.`}
  else if(k===1){const a=rnd(11,18),b=rnd(2,9);q=`Bao gạo nặng ${a} kg. Mẹ lấy ra ${b} kg. Trong bao còn bao nhiêu ki-lô-gam gạo?`;ans=a-b;ex=`${a} kg − ${b} kg = ${ans} kg.`}
  else if(k===2){const a=rnd(11,18),b=rnd(2,9);q=`Can có ${a} l dầu. Bố rót ra ${b} l. Trong can còn bao nhiêu lít dầu?`;ans=a-b;ex=`${a} l − ${b} l = ${ans} l.`}
  else{const a=rnd(3,9),b=rnd(3,9);q=`Thùng thứ nhất có ${a} l nước. Thùng thứ hai có ${b} l nước. Cả hai thùng có bao nhiêu lít nước?`;ans=a+b;ex=`${a} l + ${b} l = ${ans} l.`}
  return {type:'num',q,say:q.replace(/ kg/g,' ki-lô-gam').replace(/ l /g,' lít '),ans,hint:'Con đọc lại đề: "cả hai" là gộp lại, "còn" là bớt đi.',explain:ex}}

/* ===== Toán: dạng đổi mới và nâng cao ===== */
function expr(max){const add=Math.random()<.5;let a,b;
  if(max<=20){if(add){a=rnd(3,9);b=rnd(3,9)}else{a=rnd(11,18);b=rnd(2,9)}}
  else{if(add){a=rnd(12,55);b=rnd(6,38)}else{a=rnd(40,95);b=rnd(6,35)}}
  return add?{s:`${a} + ${b}`,v:a+b,w:`${a} cộng ${b}`}:{s:`${a} − ${b}`,v:a-b,w:`${a} trừ ${b}`}}

/* ===== Ghép vòng câu hỏi: ôn (dễ), luyện tập (dễ + đổi dạng), thử thách (nâng cao); tránh lặp câu vừa làm ===== */
const RECENT={};
const qKey=q=>[q.passage?q.passage.slice(0,20):'',q.q,q.target,q.say,q.pic,q.ans].join('|');
function build(id,gens,n){const rec=RECENT[id]||(RECENT[id]=[]),out=[],seen=new Set(),gs=shuffle(gens);let g=0;
  while(out.length<n&&g<400){const q=gs[g%gs.length]();g++;const k=qKey(q);
    if(seen.has(k))continue;if(g<=250&&rec.includes(k))continue;seen.add(k);out.push(q)}
  seen.forEach(k=>rec.push(k));if(rec.length>60)rec.splice(0,rec.length-60);return out}
const M20=[()=>genThieu(20),()=>genSoSanh(20),()=>genDungSai(20)],M100=[()=>genThieu(100),()=>genSoSanh(100),()=>genDungSai(100)];

for(const s of SUBJECTS)for(const t of s.topics){const c=CFG[t.id];if(c){t.easy=c[0];t.mix=c[1];t.hard=c[2]}
  if(t.words){const i=Number(t.id.slice(1))-1;t.easy=[enListen(i),enLook(i),enSayW(i)];t.mix=[enBlank(i),enOrder(i),enMeaning(i),enListenS(i),enSayS(i)];t.hard=[enOrder(i,true),enBlank(i,true),enReverse(i),enSayS(i,true)]}}
findTopic('v4').t.custom=mode=>{const rec=RECENT.v4||(RECENT.v4=[]),idx=ALLDOC.map((_,i)=>i),i=pick(idx.filter(x=>!rec.slice(-3).includes(x)));
  rec.push(i);if(rec.length>10)rec.shift();const d=ALLDOC[i],w=(doc,qs)=>qs.map(q=>Object.assign({passage:doc.p},q));
  if(mode==='review')return w(d,pickN(d.qs,3));
  if(mode==='hard'){const j=pick(idx.filter(x=>x!==i));return w(d,d.iq).concat(w(ALLDOC[j],ALLDOC[j].iq))}

function roundFor(t,mode){if(t.custom)return t.custom(mode);
  if(mode==='review')return build(t.id+'r',t.easy,3);
  if(mode==='hard')return build(t.id+'h',t.hard,6);
  const seen=new Set();return build(t.id+'p',t.easy,4).concat(build(t.id+'p',t.mix,4)).filter(q=>{const k=qKey(q);if(seen.has(k))return false;seen.add(k);return true})}

/* ===== Nghe số tiếng Việt thành con số ===== */
function parseNumber(text){const t=norm(text);const d=t.match(/\d+/);if(d)return parseInt(d[0],10);
  const U={'không':0,'một':1,'mốt':1,'hai':2,'ba':3,'bốn':4,'tư':4,'năm':5,'lăm':5,'nhăm':5,'sáu':6,'bảy':7,'bẩy':7,'tám':8,'chín':9};
  const w=t.split(' ');let i=w.indexOf('mươi');
  if(i>0&&w[i-1] in U){return U[w[i-1]]*10+((w[i+1] in U)?U[w[i+1]]:0)}
  i=w.indexOf('mười');if(i>=0){return 10+((w[i+1] in U)?U[w[i+1]]:0)}
  for(const x of w)if(x in U)return U[x];
  return null}
function saidMatches(target,heard){const a=norm(target).split(' '),b=new Set(norm(heard).split(' '));
  return a.filter(x=>b.has(x)).length/a.length>=0.7}
/* Chấm điểm giọng đọc: ưu tiên giọng chất lượng cao, tránh giọng vui nhộn */
function voiceScore(name,lang,want){let s=0;const n=String(name).toLowerCase(),l=String(lang).replace('_','-').toLowerCase();
  if(want&&l===want.toLowerCase())s+=5;
  if(/premium|cao cấp/.test(n))s+=4; if(/enhanced|nâng cao/.test(n))s+=3; if(/siri|natural|neural/.test(n))s+=3; if(/google/.test(n))s+=2;
  if(/samantha|daniel|kate|serena|ava|karen|moira|linh|arthur|martha/.test(n))s+=2;
  if(/compact|eloquence|albert|bad news|bahh|bells|boing|bubbles|cellos|wobble|fred|good news|jester|junior|kathy|organ|ralph|superstar|trinoids|whisper|zarvox|rocko|shelley|grandma|grandpa|eddy|flo|reed|sandy/.test(n))s-=8;
  return s}

/* ===== Giọng đọc và micro ===== */
let voiceNote='';
const allVoices=()=>{try{return speechSynthesis.getVoices()}catch(e){return[]}};
const voicesFor=kind=>allVoices().filter(v=>v.lang.replace('_','-').toLowerCase().startsWith(kind));
function pickVoice(kind){const list=voicesFor(kind);if(!list.length)return null;
  const want=kind==='vi'?S.set.voiceVi:S.set.voiceEn;const f=list.find(v=>v.voiceURI===want);if(f)return f;
  const target=kind==='vi'?'vi-VN':S.set.accent;
  return list.slice().sort((a,b)=>voiceScore(b.name,b.lang,target)-voiceScore(a.name,a.lang,target))[0]}
function say(items){try{if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const all=allVoices();
  items.forEach(it=>{const kind=it.en?'en':'vi',v=pickVoice(kind);
    if(all.length&&!v){if(kind==='vi')voiceNote='Thiết bị này chưa có giọng đọc tiếng Việt.';return}
    const u=new SpeechSynthesisUtterance(it.t);u.lang=v?v.lang:(it.en?S.set.accent:'vi-VN');if(v)u.voice=v;u.rate=S.set.rate*(it.slow?0.7:1);u.volume=1;speechSynthesis.speak(u)})}catch(e){}}
const hush=()=>{try{speechSynthesis.cancel()}catch(e){}};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let micOK=!!SR,listening=false;const micOn=()=>micOK&&S.set.mic;
function listen(en,onText){if(!micOK||listening)return;let rec;
  try{hush();rec=new SR();rec.lang=en?S.set.accent:'vi-VN';rec.interimResults=false;rec.maxAlternatives=3;
    rec.onresult=e=>{const alts=[];for(const a of e.results[0])alts.push(a.transcript);onText(alts)};
    rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){micOK=false}else if(L){L.msg={k:'info',t:'Máy chưa nghe rõ.',d:'Con nói lại nhé.'}}};
    rec.onend=()=>{listening=false;render()};
    listening=true;rec.start();render()}catch(e){micOK=false;listening=false;render()}}

/* ===== Trạng thái ===== */
let view='home',subj=null,topic=null,T=null,L=null,gate=null,sess=0,confirmReset=false;
const app=document.getElementById('app'),brk=document.getElementById('break');
const capped=()=>day().sec>=(S.set.cap+(day().extra||0))*60;
function go(v){hush();view=capped()&&v!=='gate'&&v!=='parent'?'capped':v;confirmReset=false;render();window.scrollTo(0,0)}

/* Bài giảng */
function startLearn(){const f=findTopic(topic);T={steps:lessonFor(f.t),i:0,mode:'step',alt:-1,seen:{}};view='learn';render();speakStep();window.scrollTo(0,0)}
function speakStep(){if(!T)return;
  if(T.mode==='step'){const s=T.steps[T.i];say(s.seqA||[{t:s.a}])}
  else if(T.mode==='alt'){const s=T.steps[T.alt];const again=T.seen[T.alt]>1;say(again?(s.seqA||[{t:s.a}]):(s.seqB||[{t:s.b}]))}
  else if(T.mode==='ask'){say([{t:'Con đã hiểu bài chưa?'}])}
  else if(T.mode==='which'){say([{t:'Chỗ nào con chưa hiểu? Con bấm vào chỗ đó nhé.'}])}}
/* Câu hỏi */
function startRound(mode){const f=findTopic(topic);const qs=roundFor(f.t,mode);
  L={id:f.t.id,name:f.t.name,mode,qs,i:0,first:0};prep();view='lesson';render();autoRead();window.scrollTo(0,0)}
function prep(){const q=L.qs[L.i];L.tries=0;L.phase='ask';L.input='';L.sel=null;L.msg=null;
  if(q.type==='mc')q._o=(q.fixed?q.opts:shuffle(q.opts)).map(o=>({v:o,label:o}));
  if(q.type==='order'){let o,g=0;do{o=shuffle(q.tokens.map((_,i)=>i))}while(o.every((x,i)=>x===i)&&g++<9);q._o=o;L.picked=[]}
  if(q.type==='pick')q._o=shuffle(q.opts)}
function autoRead(){if(S.set.auto&&L)readQ()}
function readQ(){const q=L.qs[L.i];
  if(q.type==='say'){say([{t:q.target,en:q.en}]);return}
  if(q.en&&q.say){say([{t:q.say,en:true}]);return}
  let t=(q.passage?q.passage+' ':'')+(q.say||q.q);
  if(q.type==='mc'&&!q.fixed&&!q.quiet)t+=' '+q._o.map(o=>o.label).join(', ');
  say([{t}])}
function judge(ok){const q=L.qs[L.i];
  if(ok){L.phase='done';if(L.tries===0){L.first++;day().stars++}logQ(L.id,L.tries===0);
    L.msg={k:'ok',t:pick(['Đúng rồi!','Chính xác!','Con làm tốt lắm!','Giỏi quá!']),d:q.explain||''};say([{t:L.msg.t}])}
  else{L.tries++;
    if(L.tries===1){L.phase='ask';L.input='';L.sel=null;L.picked=[];L.msg={k:'no',t:'Chưa đúng. Con xem gợi ý rồi thử lại nhé.',d:q.hint||''};say([{t:'Chưa đúng. '+(q.hint||'')}])}
    else{L.phase='done';logQ(L.id,false);const ex=(q.explain||'')+(q.type==='num'||q.type==='order'||q.quiet?'':' Đáp án là '+q.ans+'.');L.msg={k:'no',t:'Mình cùng xem lời giải nhé.',d:ex};say([{t:'Mình cùng xem lời giải nhé. '+ex}])}}
  render()}
function submit(){const q=L.qs[L.i];
  if(q.type==='order'){if(L.picked.length<q.tokens.length)return;judge(L.picked.map(i=>q.tokens[i]).join(' ')===q.tokens.join(' '));return}
  if(q.type==='num'){if(L.input==='')return;judge(Number(L.input)===q.ans)}
  else{if(L.sel==null)return;judge(L.sel===q.ans)}}
function next(){if(L.i<L.qs.length-1){L.i++;prep();render();autoRead()}
  else{const n=L.qs.length,st=stOf(L.id);
    if(L.mode==='hard'){L.pass=L.first>=Math.ceil(n*0.6);if(L.pass)st.c=1}
    else if(L.mode==='review'){L.pass=L.first>=Math.min(2,n);if(L.pass)st.r=1}
    else{L.pass=L.first>=Math.ceil(n*0.75);if(L.pass)st.p=1;(S.log[L.id]||(S.log[L.id]={r:0,w:0})).last=L.first+'/'+n}
    save();view='result';render();say([{t:L.pass?'Con làm tốt lắm!':'Con đã cố gắng rồi. Mình ôn lại một chút nhé.'}])}}
function heard(alts){const q=L.qs[L.i];
  if(q.type==='say'){if(alts.some(a=>saidMatches(q.target,a))){L.tries=0;judge(true)}else{L.msg={k:'info',t:'Máy nghe được: "'+alts[0]+'"',d:'Con nói lại, hoặc bấm "Con đọc xong rồi".'}}}
  else if(q.type==='num'){let n=null;for(const a of alts){n=parseNumber(a);if(n!=null)break}
    if(n==null){L.msg={k:'info',t:'Máy chưa nghe rõ.',d:'Con nói lại nhé.'}}else{L.input=String(n);L.msg={k:'info',t:'Máy nghe được: '+n,d:'Nếu đúng ý con, bấm "Trả lời".'}}}
  else{const hit=q._o.filter(o=>alts.some(a=>norm(a).includes(norm(o.v))||norm(a).includes(norm(o.label))));
    if(hit.length===1){L.sel=hit[0].v;L.msg={k:'info',t:'Máy nghe được: '+hit[0].label,d:'Nếu đúng ý con, bấm "Trả lời".'}}else{L.msg={k:'info',t:'Máy chưa nghe rõ.',d:'Con nói lại hoặc bấm chọn nhé.'}}}}

function visual(v){if(!v)return'';
  if(v.k==='frame'){const k=10-v.a,moved=v.stage>=2?k:0,out=v.b-moved;let cells='';
    for(let i=0;i<10;i++)cells+=`<div class="cell">${i<v.a?'<div class="dot"></div>':i<v.a+moved?'<div class="dot b"></div>':''}</div>`;

  if(v.k==='sub'){const extra=v.m-10,inFrame=v.stage>=2?v.s-extra:0;let cells='';
    for(let i=0;i<10;i++)cells+=`<div class="cell"><div class="dot ${i>=10-inFrame?'x':''}"></div></div>`;

  <button class="btn wide" data-act="practice"><span>3. Luyện tập</span>${mark(st.p)}</button>
  <button class="btn wide" data-act="hard"><span>4. Thử thách</span><span ${st.c?'':'style="opacity:.45"'}>🏆</span></button></div>`}
function vLearn(){const f=findTopic(topic),n=T.steps.length;let inner='';
  if(T.mode==='step'){const s=T.steps[T.i];
    const dots=T.steps.map((_,k)=>`<i class="${k<T.i?'done':k===T.i?'now':''}"></i>`).join('');
    inner=guide(`<b>${esc(s.t)}</b><br>${esc(s.a)}`)+`<section class="sheet tint ${f.s.id}">${visual(s.v)}<div class="row spread"><div class="dots" aria-label="Bước ${T.i+1} trên ${n}">${dots}</div><div class="row"><button class="btn ghost" data-act="say-step">Nghe lại</button><button class="btn" data-act="step-next">${T.i<n-1?'Tiếp':'Xong'}</button></div></div></section>`}
  else if(T.mode==='ask'){inner=guide(`<b>Con đã hiểu bài chưa?</b><br>Chưa hiểu cũng không sao, mình giảng lại cho con.`)+`<div class="steps ${f.s.id}"><button class="btn" data-act="got-it">Con hiểu rồi</button><button class="btn ghost" data-act="not-yet">Con chưa hiểu</button></div>`}
  else if(T.mode==='which'){inner=guide(`<b>Chỗ nào con chưa hiểu?</b><br>Con bấm vào chỗ đó nhé.`)+`<div class="steps ${f.s.id}">`+T.steps.map((s,k)=>`<button class="lesson" data-act="unclear" data-k="${k}"><span class="badge">${k+1}</span><span class="nm">${esc(s.t)}</span></button>`).join('')+`</div>`}
  else if(T.mode==='alt'){const s=T.steps[T.alt],again=T.seen[T.alt]>1;
    inner=guide(`<b>${esc(s.t)}</b><br>${esc(again?s.a:s.b)}${again?'<br><span class="note">Nếu vẫn khó, con nhờ bố mẹ giảng thêm chỗ này nhé.</span>':''}`)+`<section class="sheet tint ${f.s.id}">${visual(s.v)}<div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="say-step">Nghe lại</button><button class="btn" data-act="alt-done">Tiếp</button></div></section>`}
  return bar('topic-back','Bài học')+inner+(voiceNote?`<p class="note">${esc(voiceNote)}</p>`:'')}
function vLesson(){const f=findTopic(L.id),q=L.qs[L.i],done=L.phase==='done';
  const dots=L.qs.map((_,k)=>`<i class="${k<L.i?'done':k===L.i?'now':''}"></i>`).join('');
  let body='';
  if(q.type==='num'){body=`<div class="answer" aria-live="polite">${esc(L.input)||'&nbsp;'}</div>`+(done?'':`<div class="keys">${[1,2,3,4,5,6,7,8,9].map(k=>`<button class="key" data-act="key" data-k="${k}">${k}</button>`).join('')}<button class="key" data-act="key" data-k="del" aria-label="Xoá">⌫</button><button class="key" data-act="key" data-k="0">0</button><span></span></div>`)}
  else if(q.type==='mc'||q.type==='pick'){body=`<div class="opts">${q._o.map(o=>`<button class="opt" data-act="sel" data-v="${esc(o.v)}" aria-pressed="${L.sel===o.v}" ${done?'disabled':''}>${o.big?`<span class="big">${o.big}</span>`:''}${esc(o.label)}</button>`).join('')}</div>`}
  if(q.type==='order'){const left=q._o.filter(i=>!L.picked.includes(i));
    body=`<div class="answer line" aria-live="polite">${L.picked.map((i,k)=>`<button class="tok on" data-act="unpick" data-k="${k}" ${done?'disabled':''}>${esc(q.tokens[i])}</button>`).join('')||'&nbsp;'}</div>`+(done?'':`<div class="chips">${left.map(i=>`<button class="tok" data-act="pick" data-i="${i}">${esc(q.tokens[i])}</button>`).join('')}</div>`)}
  const pic=q.pic?`<div class="pic" aria-hidden="true">${q.pic}</div>${q.cap?`<p class="center note">${esc(q.cap)}</p>`:''}`:'';
  const target=q.type==='say'?`<p class="word">${esc(q.target)}</p>`:'';
  let actions='';
  if(!done){
    if(q.type==='say'){actions=`<button class="btn ghost" data-act="read">Nghe mẫu</button>${micOn()?`<button class="btn" data-act="mic" ${listening?'disabled':''}>${listening?'Đang nghe…':'Bấm rồi nói'}</button>`:''}<button class="btn ${micOn()?'ghost':''}" data-act="saydone">Con đọc xong rồi</button>`}
    else{actions=`<button class="btn ghost" data-act="read">${q.mode==='listen'?'Nghe lại':'Nghe đề'}</button>${micOn()?`<button class="btn ghost" data-act="mic" ${listening?'disabled':''}>${listening?'Đang nghe…':'Nói đáp án'}</button>`:''}<button class="btn" data-act="submit">Trả lời</button>`}
  } else actions=`<button class="btn" data-act="next">${L.i<L.qs.length-1?'Câu tiếp':'Xem kết quả'}</button>`;
  const fb=L.msg?`<div class="fb ${L.msg.k}" role="status">${esc(L.msg.t)}${L.msg.d?`<span>${esc(L.msg.d)}</span>`:''}</div>`:'';
  return `<div class="bar"><button class="back" data-act="topic-back">← Bài học</button><div class="dots" aria-label="Câu ${L.i+1} trên ${L.qs.length}">${dots}</div></div>
  <section class="sheet tint ${f.s.id}"><h3>${L.mode==='review'?'Ôn bài':L.mode==='hard'?'Thử thách':'Luyện tập'} ·${esc(L.name)}</h3>
  ${q.passage?`<p class="passage">${esc(q.passage)}</p>`:''}
  <p class="prompt ${q.sum||q.big?'sum':''}">${esc(q.q)}${q.sum?' = ?':''}</p>${pic}${target}${body}${fb}
  <div class="row">${actions}</div>${voiceNote?`<p class="note">${esc(voiceNote)}</p>`:''}</section>`}
function vResult(){const f=findTopic(L.id),n=L.qs.length;
  if(L.mode==='hard')return bar('topic-back','Bài học')+guide(L.pass?'<b>Con thật là giỏi!</b><br>Con đã vượt qua thử thách và nhận được cúp.':'<b>Thử thách này khó thật.</b><br>Con thử lại nhé, mỗi lần câu hỏi sẽ khác.')+`<section class="sheet tint ${f.s.id}"><p class="score">${L.first}/${n} câu đúng ngay</p>${L.pass?'<p class="bigstars">🏆</p>':''}<div class="row mid"><button class="btn" data-act="hard">${L.pass?'Thử thách mới':'Thử lại'}</button><button class="btn ghost" data-act="subject-back">Chọn bài khác</button></div></section>`;
  const msg=L.pass?(L.mode==='review'?'<b>Con đã hiểu bài rồi!</b><br>Mình sang phần luyện tập nhé.':'<b>Con làm tốt lắm!</b><br>Con được thêm một ngôi sao cho bài này.'):(L.mode==='review'?'<b>Mình xem lại bài giảng nhé.</b><br>Nghe thêm một lần nữa là con sẽ hiểu.':'<b>Con đã cố gắng rồi.</b><br>Luyện thêm một lần nữa nhé.');
  const btns=L.mode==='review'?(L.pass?`<button class="btn" data-act="practice">Luyện tập</button>`:`<button class="btn" data-act="learn">Nghe giảng lại</button><button class="btn ghost" data-act="review">Ôn lại</button>`):(L.pass?`<button class="btn" data-act="hard">Làm thử thách</button><button class="btn ghost" data-act="subject-back">Chọn bài khác</button>`:`<button class="btn" data-act="practice">Luyện lại</button><button class="btn ghost" data-act="learn">Nghe giảng lại</button>`);
  return bar('topic-back','Bài học')+guide(msg)+`<section class="sheet tint ${f.s.id}"><p class="score">${L.first}/${n} câu đúng ngay</p><p class="bigstars" aria-label="${starCount(L.id)} trên 3 sao">${starsHtml(starCount(L.id),3)}</p><div class="row mid">${btns}</div></section>`}
function vGate(){return `<section class="sheet"><h2>Dành cho bố mẹ</h2><p>Bố mẹ tính giúp: <b>${gate.a} × ${gate.b}</b></p>
  <div class="row"><input id="gate-in" type="number" inputmode="numeric" aria-label="Kết quả"><button class="btn small" data-act="gate-ok">Mở</button><button class="btn ghost small" data-act="home">Quay lại</button></div>${gate.err?'<p class="fb no">Chưa đúng, mời thử phép tính mới.</p>':''}</section>`}
function report(){const d=day();let t=`Báo cáo Vở Học Lớp 2, ngày ${today()}\nHôm nay: ${mins(d.sec)} phút, ${d.stars} sao\n`;
  SUBJECTS.forEach(s=>s.topics.forEach(tp=>{const l=S.log[tp.id],u=S.unclear[tp.id];
    if(l&&(l.r+l.w))t+=`${s.name} | ${tp.name}: đúng ngay ${l.r}, cần gợi ý hoặc sai ${l.w}${l.last?', luyện tập gần nhất '+l.last:''}, sao ${starCount(tp.id)}/3\n`;
    if(u){const st=lessonFor(tp);Object.keys(u).forEach(k=>{t+=`  Chưa hiểu "${st[k]?st[k].t:k}": ${u[k]} lần\n`})}}));
  return t}
function vParent(){const d=day();let rows='',weak=[],unc=[];
  SUBJECTS.forEach(s=>s.topics.forEach(t=>{const l=S.log[t.id],u=S.unclear[t.id];
    if(u){const st=lessonFor(t);Object.keys(u).forEach(k=>unc.push(`${t.name}: ${st[k]?st[k].t:k} (${u[k]} lần)`))}
    if(!l||!(l.r+l.w))return;const n=l.r+l.w,pc=Math.round(l.r*100/n);
    if(n>=5&&pc<70)weak.push(s.name+': '+t.name);
    rows+=`<tr><td>${esc(s.name)}</td><td>${esc(t.name)}</td><td class="n">${n}</td><td class="n">${pc}%</td><td class="n">${starCount(t.id)}/3</td></tr>`}));
  const opt=(arr,cur,unit)=>arr.map(v=>`<option value="${v}" ${v==cur?'selected':''}>${v}${unit}</option>`).join('');
  const vopt=(kind,cur)=>{const list=voicesFor(kind),auto=pickVoice(kind);
    return `<option value="">Tự chọn${auto?' ('+esc(auto.name)+')':''}</option>`+list.map(v=>`<option value="${esc(v.voiceURI)}" ${v.voiceURI===cur?'selected':''}>${esc(v.name)} · ${esc(v.lang)}</option>`).join('')};
  const hasVi=voicesFor('vi').length>0;
  return `<div class="bar"><h2>Trang của bố mẹ</h2><button class="back" data-act="home">← Về vở</button></div>
  <section class="sheet"><h3>Hôm nay</h3><p>${mins(d.sec)} phút học, ${d.stars} sao. Giới hạn hôm nay: ${S.set.cap+(d.extra||0)} phút.</p></section>
  <section class="sheet"><h3>Giọng đọc</h3>
   <p class="note">Ứng dụng dùng giọng đọc cài sẵn trên máy và tự chọn giọng tốt nhất. Trên iPhone, iPad, bố mẹ tải thêm giọng "Nâng cao" trong Cài đặt, Trợ năng, Nội dung được đọc, Giọng nói để giọng tự nhiên và rõ hơn.</p>
   <p class="note">Ứng dụng đã phát ở mức to nhất. Nếu tiếng nhỏ: bấm nút tăng âm lượng đúng lúc máy đang đọc. Trên iPhone, sau khi dùng micro tiếng có thể nhỏ đi; khi đó bố mẹ tắt mục "Bé nói để trả lời" bên dưới rồi mở lại ứng dụng.</p>
   ${hasVi?'':'<p class="fb no">Máy này chưa có giọng đọc tiếng Việt.</p>'}
   <div class="row"><label>Giọng tiếng Việt<select id="set-voice-vi">${vopt('vi',S.set.voiceVi)}</select></label><button class="btn ghost small" data-act="test-vi">Nghe thử</button></div>
   <div class="row"><label>Kiểu tiếng Anh<select id="set-accent"><option value="en-GB" ${S.set.accent==='en-GB'?'selected':''}>Anh-Anh (theo sách)</option><option value="en-US" ${S.set.accent==='en-US'?'selected':''}>Anh-Mỹ</option></select></label>
   <label>Giọng tiếng Anh<select id="set-voice-en">${vopt('en',S.set.voiceEn)}</select></label><button class="btn ghost small" data-act="test-en">Nghe thử</button></div>
   <div class="row"><label>Tốc độ đọc<select id="set-rate">${[[0.75,'Chậm'],[0.9,'Vừa'],[1,'Bình thường']].map(([v,n])=>`<option value="${v}" ${v==S.set.rate?'selected':''}>${n}</option>`).join('')}</select></label>
   <label>Bé nói để trả lời<select id="set-mic"><option value="1" ${S.set.mic?'selected':''}>Bật</option><option value="0" ${S.set.mic?'':'selected'}>Tắt</option></select></label>
   <label>Tự đọc đề<select id="set-auto"><option value="1" ${S.set.auto?'selected':''}>Bật</option><option value="0" ${S.set.auto?'':'selected'}>Tắt</option></select></label></div>
   <p class="note">Micro để bé nói: ${micOK?'trình duyệt có hỗ trợ':'chưa dùng được ở đây, cần mở bằng Safari ở địa chỉ riêng'}.</p></section>
  <section class="sheet"><h3>Kết quả theo bài</h3>${rows?`<div class="scroll"><table><thead><tr><th>Môn</th><th>Bài</th><th class="n">Số câu</th><th class="n">Đúng ngay</th><th class="n">Sao</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<p class="note">Chưa có kết quả. Bảng này hiện sau khi bé làm bài đầu tiên.</p>'}
  ${weak.length?`<p><b>Nên luyện thêm:</b> ${esc(weak.join('; '))}</p>`:''}${unc.length?`<p><b>Bé bấm "chưa hiểu" ở:</b> ${esc(unc.join('; '))}</p>`:''}</section>
  <section class="sheet"><h3>Thời lượng</h3><div class="row">
   <label>Nghỉ sau mỗi<select id="set-session">${opt([15,20,25,30],S.set.session,' phút')}</select></label>
   <label>Tối đa mỗi ngày<select id="set-cap">${opt([30,45,60,90,120],S.set.cap,' phút')}</select></label></div></section>
  <section class="sheet"><h3>Báo cáo gửi cho Claude</h3><p class="note">Sao chép rồi dán vào cuộc trò chuyện để soạn bài tuần sau.</p><textarea id="report" readonly>${esc(report())}</textarea>
   <div class="row"><button class="btn small" data-act="copy">Sao chép báo cáo</button><span id="copied" class="note" role="status"></span></div></section>
  <section class="sheet"><h3>Xoá tiến độ</h3><div class="row">${confirmReset?'<button class="btn small" data-act="reset-yes">Xoá hết, không khôi phục được</button><button class="btn ghost small" data-act="reset-no">Giữ lại</button>':'<button class="btn ghost small" data-act="reset">Xoá toàn bộ tiến độ</button>'}</div></section>`}
function vCapped(){return guide(`<b>Hôm nay con học đủ rồi.</b><br>Con đã học ${mins(day().sec)} phút và được ${day().stars} sao. Hẹn con ngày mai nhé!`)+`<div class="row mid"><button class="back" data-act="gate">Bố mẹ</button></div>`}

/* ===== Nghỉ giữa giờ và giới hạn ngày ===== */
let breakLeft=0;
function showBreak(){breakLeft=180;brk.hidden=false;hush();drawBreak()}
function drawBreak(){const m=Math.floor(breakLeft/60),s=String(breakLeft%60).padStart(2,'0');
  brk.innerHTML=`<section class="sheet">${MASCOT}<h2>Giờ nghỉ mắt</h2><p>Con nhìn ra xa, uống nước và vươn vai nhé.</p><p class="count">${m}:${s}</p><button class="btn" data-act="break-end" ${breakLeft>0?'disabled':''}>Học tiếp</button></section>`}
setInterval(()=>{if(document.hidden)return;
  if(!brk.hidden){if(breakLeft>0){breakLeft--;drawBreak()}return}
  if(view==='gate'||view==='parent'||view==='capped')return;
  const d=day();d.sec++;sess++;if(d.sec%15===0)save();
  if(capped()){save();hush();view='capped';render();return}
  if(sess>=S.set.session*60){sess=0;showBreak()}},1000);

/* ===== Bấm nút ===== */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='home'){go('home')}
  else if(a==='subject'){subj=b.dataset.id;go('subject')}
  else if(a==='subject-back'){if(topic)subj=findTopic(topic).s.id;go('subject')}
  else if(a==='topic'){topic=b.dataset.id;go('topic')}
  else if(a==='topic-back'){go('topic')}
  else if(a==='learn'){startLearn()}
  else if(a==='review'||a==='practice'||a==='hard'){startRound(a)}
  else if(a==='say-step'){speakStep()}
  else if(a==='step-next'){if(T.i<T.steps.length-1){T.i++}else{T.mode='ask'}render();speakStep();window.scrollTo(0,0)}
  else if(a==='got-it'){stOf(topic).l=1;save();startRound('review')}
  else if(a==='not-yet'){T.mode='which';render();speakStep()}
  else if(a==='unclear'){const k=Number(b.dataset.k);T.alt=k;T.seen[k]=(T.seen[k]||0)+1;const u=S.unclear[topic]||(S.unclear[topic]={});u[k]=(u[k]||0)+1;save();T.mode='alt';render();speakStep();window.scrollTo(0,0)}
  else if(a==='alt-done'){T.mode='ask';render();speakStep()}
  else if(a==='key'){const k=b.dataset.k;if(k==='del')L.input=L.input.slice(0,-1);else if(L.input.length<3)L.input+=k;render()}
  else if(a==='sel'){L.sel=b.dataset.v;render()}
  else if(a==='pick'){L.picked.push(Number(b.dataset.i));render()}
  else if(a==='unpick'){L.picked.splice(Number(b.dataset.k),1);render()}
  else if(a==='submit'){submit()}
  else if(a==='next'){next()}
  else if(a==='read'){readQ()}
  else if(a==='mic'){const q=L.qs[L.i];listen(!!q.en,alts=>{heard(alts)})}
  else if(a==='saydone'){L.tries=0;judge(true)}
  else if(a==='gate'){hush();gate={a:rnd(12,19),b:rnd(6,9)};view='gate';render()}
  else if(a==='gate-ok'){const v=Number(document.getElementById('gate-in').value);if(v===gate.a*gate.b){if(capped()){day().extra=(day().extra||0)+30;save()}view='parent'}else{gate={a:rnd(12,19),b:rnd(6,9),err:true}}render()}
  else if(a==='test-vi'){say([{t:'Chào con! Hôm nay mình cùng học bài nhé.'}])}
  else if(a==='test-en'){say([{t:'Hello! This is a kite. The kite is in the backyard.',en:true}])}
  else if(a==='copy'){const ta=document.getElementById('report'),msg=document.getElementById('copied');
    const fall=()=>{ta.focus();ta.select();msg.textContent='Đã bôi chọn, bố mẹ bấm Sao chép.'};
    try{navigator.clipboard.writeText(ta.value).then(()=>{msg.textContent='Đã sao chép.'}).catch(fall)}catch(x){fall()}}
  else if(a==='reset'){confirmReset=true;render()}
  else if(a==='reset-no'){confirmReset=false;render()}
  else if(a==='reset-yes'){S.log={};S.days={};S.st={};S.unclear={};for(const k in RECENT)delete RECENT[k];confirmReset=false;save();render()}
  else if(a==='break-end'){brk.hidden=true;brk.innerHTML=''}
});
document.addEventListener('change',e=>{const id=e.target.id,v=e.target.value;
  if(id==='set-session')S.set.session=Number(v);else if(id==='set-cap')S.set.cap=Number(v);
  else if(id==='set-rate')S.set.rate=Number(v);else if(id==='set-auto')S.set.auto=v==='1';
  else if(id==='set-mic')S.set.mic=v==='1';else if(id==='set-voice-vi')S.set.voiceVi=v;else if(id==='set-voice-en')S.set.voiceEn=v;
  else if(id==='set-accent'){S.set.accent=v;S.set.voiceEn='';save();render();return}
  else return;
  save()});
try{speechSynthesis.getVoices();speechSynthesis.addEventListener('voiceschanged',()=>{if(view==='parent')render()})}catch(e){}
render();
})()}
</script>

</body></html>
